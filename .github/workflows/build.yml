name: Build and Publish Genetic Simulation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Разрешаем GitHub Actions публиковать пакеты в GHCR
permissions:
  contents: read
  packages: write

jobs:

  # --------------------------------------------------
  # HTML VERSION
  # --------------------------------------------------
  build-html:
    name: Check HTML version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required HTML files
        run: |
          test -f html-version/index.html
          test -f html-version/styles.css
          test -f html-version/bundle.js
          test -f html-version/bundle-main.js
          test -f html-version/bundle-bare.js
          test -f html-version/Dockerfile

      - name: Prepare HTML artifact
        run: |
          mkdir -p artifacts/html
          cp -r html-version/* artifacts/html/

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetic-simulation-html
          path: artifacts/html/


  # --------------------------------------------------
  # REACT VERSION
  # --------------------------------------------------
  build-react:
    name: Build React version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check React project
        working-directory: react-version
        run: |
          test -f package.json
          test -f index.html
          test -f vite.config.js
          test -f src/main.jsx
          test -f src/App.jsx

      - name: Install dependencies
        working-directory: react-version
        run: npm install

      - name: Build React application
        working-directory: react-version
        run: npm run build

      - name: Check build result
        working-directory: react-version
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Upload React artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetic-simulation-react
          path: react-version/dist/


  # --------------------------------------------------
  # BUILD AND PUBLISH DOCKER IMAGES
  # --------------------------------------------------
  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest

    needs:
      - build-html
      - build-react

    # Не публикуем образы для Pull Request.
    # Публикация выполняется только после push в main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Авторизация в GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadata для HTML image
      - name: Docker metadata HTML
        id: meta-html
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/serjievg/genetic-simulation-html
          tags: |
            type=raw,value=latest
            type=sha

      # Metadata для React image
      - name: Docker metadata React
        id: meta-react
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/serjievg/genetic-simulation-react
          tags: |
            type=raw,value=latest
            type=sha

      # Build & Push HTML
      - name: Build and push HTML image
        uses: docker/build-push-action@v6
        with:
          context: ./html-version
          push: true
          tags: ${{ steps.meta-html.outputs.tags }}
          labels: ${{ steps.meta-html.outputs.labels }}

      # Build & Push React
      - name: Build and push React image
        uses: docker/build-push-action@v6
        with:
          context: ./react-version
          push: true
          tags: ${{ steps.meta-react.outputs.tags }}
          labels: ${{ steps.meta-react.outputs.labels }}