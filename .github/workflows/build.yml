name: Build Genetic Simulation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==================================================
  # HTML VERSION
  # ==================================================
  build-html:
    name: Build HTML version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML project
        run: |
          test -f html-version/index.html
          test -f html-version/styles.css
          test -f html-version/bundle.js
          test -f html-version/bundle-main.js
          test -f html-version/bundle-bare.js
          test -f html-version/Dockerfile

      - name: Upload HTML project
        uses: actions/upload-artifact@v4
        with:
          name: genetic-simulation-html-source
          path: html-version/


  # ==================================================
  # REACT VERSION
  # ==================================================
  build-react:
    name: Build React version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check React project
        working-directory: react-version
        run: |
          test -f package.json
          test -f index.html
          test -f vite.config.js
          test -f src/main.jsx
          test -f src/App.jsx
          test -f Dockerfile

      - name: Install dependencies
        working-directory: react-version
        run: npm install

      - name: Build React application
        working-directory: react-version
        run: npm run build

      - name: Check React build
        working-directory: react-version
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Upload React build
        uses: actions/upload-artifact@v4
        with:
          name: genetic-simulation-react-build
          path: react-version/dist/


  # ==================================================
  # DOCKER IMAGES
  # ==================================================
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest

    needs:
      - build-html
      - build-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # HTML IMAGE
      # ----------------------------------------------
      - name: Build HTML Docker image
        run: |
          docker build \
            -t genetic-simulation-html:latest \
            ./html-version

      - name: Save HTML Docker image
        run: |
          docker save \
            genetic-simulation-html:latest \
            -o genetic-simulation-html.tar

      # ----------------------------------------------
      # REACT IMAGE
      # ----------------------------------------------
      - name: Build React Docker image
        run: |
          docker build \
            -t genetic-simulation-react:latest \
            ./react-version

      - name: Save React Docker image
        run: |
          docker save \
            genetic-simulation-react:latest \
            -o genetic-simulation-react.tar

      # ----------------------------------------------
      # CHECK TAR FILES
      # ----------------------------------------------
      - name: Check Docker images
        run: |
          ls -lh *.tar

      # ----------------------------------------------
      # UPLOAD DOCKER IMAGES
      # ----------------------------------------------
      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: genetic-simulation-docker-images
          path: |
            genetic-simulation-html.tar
            genetic-simulation-react.tar