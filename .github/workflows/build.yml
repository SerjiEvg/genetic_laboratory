name: Build Genetic Simulation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-html:
    name: Build HTML version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML project
        run: |
          test -f html-version/index.html
          test -f html-version/styles.css
          test -f html-version/bundle.js

      - name: Prepare HTML artifact
        run: |
          mkdir -p artifacts/html
          cp -r html-version/* artifacts/html/

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetic-simulation-html
          path: artifacts/html/


  build-react:
    name: Build React version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: react-version
        run: npm install

      - name: Build React
        working-directory: react-version
        run: npm run build

      - name: Upload React artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetic-simulation-react
          path: react-version/dist/


  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest

    needs:
      - build-html
      - build-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HTML Docker image
        run: |
          docker build \
            -t genetic-simulation-html:latest \
            ./html-version

      - name: Build React Docker image
        run: |
          docker build \
            -t genetic-simulation-react:latest \
            ./react-version